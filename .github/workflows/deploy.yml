# 后端 CI/CD：构建 jar → 上传服务器 → 重建容器
# 【2026-11-09 起停用自动触发】：Actions 额度留给其他项目，
# 改为「本地打包 → 手动上传服务器」流程（见 docs/开发计划.md P4）。
# 保留本文件仅为存档与应急手动恢复：如需临时恢复自动部署，
# 把 on 触发器里 push 注释打开即可（勿长期开启，注意额度）。
name: Deploy Backend

on:
  workflow_dispatch:
  # push:
  #   branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17（含 Maven 缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 打包
        run: mvn -B -DskipTests package

      - name: 校验 PostgreSQL 驱动已打入 jar
        run: |
          jar=$(ls target/*.jar | head -1)
          if ! unzip -l "$jar" | grep -q 'postgresql'; then
            echo "::error::jar 缺少 PostgreSQL 驱动（检查 pom 依赖）"
            exit 1
          fi
          echo "校验通过：$jar"

      - name: 上传 jar 并重建容器
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: 8.134.91.151
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          jar=$(ls target/*.jar | head -1)
          echo "上传 $jar -> root@$HOST:/opt/ailang/server/app.jar"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$jar" root@$HOST:/opt/ailang/server/app.jar
          # 1) 只强制重建 backend：确保按当前 /opt/ailang/server/.env 生效（.env 变更不会自动触发重建）
          # 2) 其余服务用普通 up：仅当其配置/镜像变化时才重建，避免 minio/web 无谓抖动
          # 3) reload wheretogo-nginx：backend 重建后容器 IP 可能变化，须刷新 nginx 缓存的 upstream IP，
          #    否则会持续 502（nginx 在启动时解析并缓存 proxy_pass 主机名）
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@$HOST \
            "set -e; cd /opt/ailang/server && \
             docker compose up -d --build --force-recreate backend && \
             docker compose up -d && \
             (docker exec wheretogo-nginx nginx -s reload || true) && \
             docker compose ps --format 'table {{.Name}}\t{{.Status}}'"