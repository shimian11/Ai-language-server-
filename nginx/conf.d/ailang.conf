# 服务器 wheretogo-nginx 中 aillang 项目的域名分流（MinIO + 博客站点）
# 复用宿主 nginx 的 80/443；目标全量配置，与 docs/运维部署.md 第 6 节一致
server {
    listen 80;
    server_name blog.where2go.xyz s3.where2go.xyz *.s3.where2go.xyz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name blog.where2go.xyz;
    ssl_certificate /etc/nginx/ssl/wildcard.where2go.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard.where2go.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 20m;
    location / {
        proxy_pass http://ailang-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://ailang-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 443 ssl http2;
    server_name s3.where2go.xyz *.s3.where2go.xyz;
    ssl_certificate /etc/nginx/ssl/wildcard.where2go.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard.where2go.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    location / {
        proxy_pass http://ailang-minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}