# 服务器 wheretogo-nginx 中的 aillang 域名反代（MinIO 对象存储）
# 复用宿主 nginx 的 80/443，将 s3.where2go.xyz（含通配 *.）反代到 ailang-minio:9000
server {
    listen 80;
    server_name s3.where2go.xyz *.s3.where2go.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name s3.where2go.xyz *.s3.where2go.xyz;

    ssl_certificate /etc/nginx/ssl/wildcard.where2go.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard.where2go.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;

    location / {
        proxy_pass http://ailang-minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}